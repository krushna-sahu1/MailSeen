<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in · MailSeen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090a0f;
      --surface: #10131b;
      --border: #1d2232;
      --border-hover: #2e364f;
      --text: #f1f3f9;
      --text-muted: #828c9f;
      --primary: #4f46e5;
      --primary-hover: #6366f1;
      --rose: #ef4444;
      --rose-bg: rgba(239, 68, 68, 0.12);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .brand-icon { font-size: 22px; }
    .brand-title { font-size: 17px; font-weight: 600; }

    label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input[type="password"]:focus { border-color: var(--primary); }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }

    .error {
      margin-bottom: 14px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--rose-bg);
      color: var(--rose);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <form class="card" method="post">
    <div class="brand">
      <div class="brand-icon">📬</div>
      <div class="brand-title">MailSeen</div>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Dashboard password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" autofocus required />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
